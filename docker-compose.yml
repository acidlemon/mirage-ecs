version: '3'

services:
  mirage-ecs:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "80:80"  # WebUIとリバースプロキシ用ポート
    # volumes:
    #   - ./config.yml:/opt/mirage/config.yml
    environment:
      # - MIRAGE_CONF=/opt/mirage/config.yml
      - MIRAGE_LOG_LEVEL=info
    command: ["-local"]  # ローカルモードで実行
    restart: unless-stopped

